[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lichess-pipeline"
version = "0.3.1"
description = "Lichess Hugging Face Parquet ingestion into Delta"
requires-python = ">=3.11"

[project.scripts]
sync = "lichess_pipeline.cli:sync"

[tool.setuptools.packages.find]
where = ["src"]
