[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pgn-timing"
version = "0.1.0"
description = "Time each stage of Lichess .pgn.zst -> Parquet -> Iceberg (ingestion spike)"
requires-python = ">=3.11"
dependencies = [
  "zstandard>=0.23",
  "pyarrow>=17",
]

[project.optional-dependencies]
iceberg = ["pyiceberg[sql-sqlite,pyarrow]>=0.9"]
pychess = ["chess>=1.10"]
dev = ["pytest>=8"]

[project.scripts]
pgn-timing = "pgn_timing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
