name: Databricks CI and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test
        run: python -m pytest -q
      - name: Build wheel
        run: python -m build --wheel

  deploy:
    name: Deploy Databricks dev
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: databricks-dev
    concurrency:
      group: databricks-lichess-dev-deploy
      cancel-in-progress: false
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_AUTH_TYPE: pat
      EXPECTED_DATABRICKS_USER: ${{ vars.DATABRICKS_DEPLOY_USER }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: databricks/setup-cli@9230f12203ef173d0b901846f62a55ce997efef7
        with:
          version: '1.19.0'
      - name: Install wheel build tooling
        run: python -m pip install 'build>=1.2,<2'
      - name: Check deployment identity
        shell: bash
        run: |
          set -euo pipefail
          : "${DATABRICKS_HOST:?Configure the databricks-dev environment host variable}"
          : "${DATABRICKS_TOKEN:?Configure the databricks-dev environment token secret}"
          : "${EXPECTED_DATABRICKS_USER:?Configure the databricks-dev deployment user variable}"
          actual_user="$(databricks current-user me --output json | jq -r '.userName')"
          if [[ "$actual_user" != "$EXPECTED_DATABRICKS_USER" ]]; then
            echo '::error::Deployment identity differs from the existing dev bundle owner; refusing to create a duplicate deployment.'
            exit 1
          fi
      - name: Validate bundle
        run: databricks bundle validate --target dev
      - name: Deploy bundle
        run: databricks bundle deploy --target dev --auto-approve --fail-on-active-runs
      - name: Deployment summary
        run: databricks bundle summary --target dev >> "$GITHUB_STEP_SUMMARY"
