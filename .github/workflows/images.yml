# Container images, built the same way for every change:
#   pull requests  build → test inside the image → Trivy scan          (nothing is pushed)
#   main           the same, then push to ACR with SBOM + SLSA provenance attestations
#                  and a cosign keyless signature
#
# Azure sign-in uses GitHub OIDC: Azure trusts this repo's workflow on main (federated
# credential on id-lichess-ci, AcrPush only). No passwords or keys are stored anywhere.
# Repository secrets hold only IDs: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, ACR_NAME.
#
# Tags: :<commit sha> (immutable) and :main (latest). Kyverno resolves tags to digests and
# checks the signature at admission (#62), so the cluster runs exactly what CI built.
#
# Releases: workflow and Spark pods start fresh each run and pick up :main. The long-running
# services (chess-api, chess-web, chess-mcp, chess-chat) wouldn't, so job `release` commits their new digests to
# the deploy-state branch, which their ApplicationSets read (deploy/README.md).
name: images

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  image:
    name: ${{ matrix.image }}
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to 26.04; bump deliberately
    permissions:
      contents: read
      id-token: write # Azure OIDC sign-in and cosign keyless signing (used on main only)
    outputs: # one name per release app; the legs that don't set one leave it empty
      chess-api: ${{ steps.record.outputs.chess-api }}
      chess-web: ${{ steps.record.outputs.chess-web }}
      chess-mcp: ${{ steps.record.outputs.chess-mcp }}
      chess-chat: ${{ steps.record.outputs.chess-chat }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: lichess-ingest
            context: ingest
            target: runtime
            pretest_target: test # unit tests run inside the image build
            smoke: |
              docker run --rm "$IMAGE" --help
          - image: lichess-spark
            context: spark
            target: job
            pretest_target: ""
            smoke: |
              docker run --rm --entrypoint bash "$IMAGE" -c "ls /opt/spark/jars | grep -E 'iceberg-spark-runtime-4.1|iceberg-azure-bundle|hadoop-azure-3.4'"
              docker run --rm --entrypoint /opt/spark/bin/spark-submit "$IMAGE" --master 'local[2]' /opt/lichess/tests/local_smoke.py
              docker run --rm --entrypoint /opt/spark/bin/spark-submit "$IMAGE" --master 'local[2]' /opt/lichess/tests/local_raw.py
              docker run --rm --entrypoint /opt/spark/bin/spark-submit "$IMAGE" --master 'local[2]' /opt/lichess/tests/local_curated.py
              docker run --rm --entrypoint /opt/spark/bin/spark-submit "$IMAGE" --master 'local[2]' /opt/lichess/tests/local_explorer.py
              docker run --rm --entrypoint /opt/spark/bin/spark-submit "$IMAGE" --master 'local[2]' /opt/lichess/tests/local_maintenance.py
              docker run --rm --entrypoint /opt/spark/bin/spark-submit "$IMAGE" --master 'local[2]' /opt/lichess/tests/local_catalog_recovery.py
              docker run --rm --entrypoint /opt/spark/bin/spark-submit "$IMAGE" --master 'local[2]' /opt/lichess/tests/local_cost.py
          - image: lichess-api # the data API (namespace chess-api)
            release: chess-api # long-running: digest recorded on deploy-state (job release)
            context: api
            target: runtime
            pretest_target: test
            smoke: |
              docker run -d --rm --read-only --cap-drop ALL --name api -p 8000:8000 "$IMAGE"
              for i in $(seq 20); do curl -fsS localhost:8000/healthz && break; sleep 1; done
              curl -fsS localhost:8000/api/openapi.json | python3 -c "import json,sys; assert '/api/v1/summary' in json.load(sys.stdin)['paths']"
              docker stop api
          - image: lichess-mcp # the MCP server (namespace chess-mcp, #68)
            release: chess-mcp
            context: mcp-server
            target: runtime
            pretest_target: test
            smoke: |
              docker run -d --rm --read-only --cap-drop ALL --name mcp -p 8000:8000 \
                -e CHESS_MCP_TENANT_ID=00000000-0000-0000-0000-000000000000 \
                -e CHESS_MCP_CLIENT_ID=00000000-0000-0000-0000-000000000001 "$IMAGE"
              for i in $(seq 20); do curl -fsS localhost:8000/healthz && break; sleep 1; done
              test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/mcp -H 'Content-Type: application/json' -d '{}')" = 401
              curl -fsS localhost:8000/.well-known/oauth-protected-resource | python3 -c "import json,sys; assert json.load(sys.stdin)['scopes_supported']"
              docker stop mcp
          - image: lichess-chat # the chat backend (namespace chess-chat, #69)
            release: chess-chat
            context: chat
            target: runtime
            pretest_target: test
            smoke: |
              docker run -d --rm --read-only --tmpfs /data --cap-drop ALL --name chat -p 8000:8000 \
                -e CHESS_CHAT_TENANT_ID=00000000-0000-0000-0000-000000000000 \
                -e CHESS_CHAT_CLIENT_ID=00000000-0000-0000-0000-000000000003 "$IMAGE"
              for i in $(seq 20); do curl -fsS localhost:8000/healthz && break; sleep 1; done
              test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/api/v1/chat -d '{}')" = 401
              docker stop chat
          - image: lichess-web # the dashboard (namespace chess-web); Playwright runs in ci.yml
            release: chess-web
            context: web
            target: runtime
            pretest_target: test # lint, typecheck, unit tests
            smoke: |
              docker run -d --rm --read-only --tmpfs /tmp --cap-drop ALL --name web -p 8080:8080 "$IMAGE"
              for i in $(seq 20); do curl -fsS localhost:8080/healthz && break; sleep 1; done
              curl -fsS localhost:8080/ | grep -q 'id="root"'
              curl -fsS localhost:8080/openings | grep -q 'id="root"' # client-side route: index.html
              curl -fsSI localhost:8080/ | grep -qi '^content-security-policy:'
              test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/v1/months)" = 404
              docker stop web
          - image: lichess-notebook
            context: spark
            target: notebook
            pretest_target: ""
            smoke: |
              docker run --rm "$IMAGE" jupyter lab --version
              docker run --rm "$IMAGE" python3 /opt/lichess/tests/local_notebook.py
    env:
      IMAGE: ${{ matrix.image }}:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Tests inside the image
        if: matrix.pretest_target != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.pretest_target }}
          cache-from: type=gha,scope=${{ matrix.image }}
          push: false

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - name: Smoke test
        run: ${{ matrix.smoke }}

      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy.json
          exit-code: "0"
          trivyignores: .trivyignore

      - name: Fail on fixable critical vulnerabilities
        run: python3 .github/scripts/trivy_report.py trivy.json "${{ matrix.image }}"

      # ---- main only: publish ----
      - name: Azure sign-in (GitHub OIDC)
        if: env.PUBLISH == 'true'
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: .github/scripts/azure_oidc_login.sh

      - name: Registry sign-in
        if: env.PUBLISH == 'true'
        run: az acr login --name "${{ secrets.ACR_NAME }}"

      - name: Push with SBOM and provenance
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          tags: |
            ${{ secrets.ACR_NAME }}.azurecr.io/${{ matrix.image }}:${{ github.sha }}
            ${{ secrets.ACR_NAME }}.azurecr.io/${{ matrix.image }}:main
          push: true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUBLISH == 'true'

      - name: Sign (cosign keyless, identity = this workflow on main)
        if: env.PUBLISH == 'true'
        env:
          REF: ${{ secrets.ACR_NAME }}.azurecr.io/${{ matrix.image }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$REF"

      - name: Summary
        if: env.PUBLISH == 'true'
        run: |
          {
            echo "### ${{ matrix.image }}"
            echo "- tags: \`${{ github.sha }}\`, \`main\`"
            echo "- digest: \`${{ steps.push.outputs.digest }}\`"
            echo "- signed by: \`${{ github.server_url }}/${{ github.repository }}/.github/workflows/images.yml@refs/heads/main\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record the signed digest for the release job
        id: record
        if: env.PUBLISH == 'true' && matrix.release
        run: echo "${{ matrix.release }}=${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"

  # Commit the new chess-api / chess-web / chess-mcp / chess-chat digests to the deploy-state branch, so Argo CD sees
  # a change and rolls them out. Its own job so that only checkout runs with write access,
  # and an app whose image failed keeps its last good build. deploy-state is not main:
  # main's ruleset (PRs + review) still holds, and GITHUB_TOKEN pushes don't start workflows.
  release:
    name: release chess-api, chess-web, chess-mcp, chess-chat
    needs: image
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write # push to deploy-state
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # history, to refuse moving deploy-state back to an older commit
          filter: blob:none
      - name: Commit digests to deploy-state
        env:
          CHESS_API: ${{ needs.image.outputs.chess-api }}
          CHESS_WEB: ${{ needs.image.outputs.chess-web }}
          CHESS_MCP: ${{ needs.image.outputs.chess-mcp }}
          CHESS_CHAT: ${{ needs.image.outputs.chess-chat }}
        run: .github/scripts/release_state.sh
