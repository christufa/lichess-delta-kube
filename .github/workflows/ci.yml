name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  spike-pgn-timing:
    name: spike/pgn_timing tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: spike/pgn_timing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[iceberg,pychess,dev]"
      - name: pytest
        shell: bash
        run: |
          set -o pipefail
          pytest -q -rfE --tb=short 2>&1 | tee pytest.log
      - name: Surface failures as annotations
        if: failure()
        shell: bash
        run: grep -E "^(FAILED|ERROR|E  )" pytest.log | head -40 | sed 's/^/::error::/'

  spike-docker:
    name: spike/pgn_timing docker image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spike/pgn_timing
    steps:
      - uses: actions/checkout@v4
      - name: Build and run tests in the image
        run: docker build --target test -t pgn-timing:test .
      - name: Build runtime image
        run: docker compose build
      - name: Smoke test parse and commit through compose
        run: |
          docker run --rm -v lichess-data:/data --entrypoint python pgn-timing:test -c "
          import random, sys, zstandard
          sys.path.insert(0, '/app/tests')
          from conftest import make_game
          rng = random.Random(0)
          text = ''.join(make_game(i, rng) for i in range(20000))
          open('/data/sample.pgn.zst', 'wb').write(zstandard.ZstdCompressor().compress(text.encode()))
          "
          docker compose run --rm spike --report /data/runs.jsonl parse /data/sample.pgn.zst --workers 2 --chunk-mb 4 --out /data/parquet \
            | python3 -c "import json,sys; r=json.load(sys.stdin); assert r['games'] == 20000, r; print(r['games'], 'games', r['games_per_s'], 'games/s')"
          docker compose run --rm spike commit /data/parquet --warehouse /data/warehouse \
            | python3 -c "import json,sys; r=json.load(sys.stdin); assert r['rows'] == 20000, r; print(r['rows'], 'rows committed')"
          docker compose run --rm --entrypoint cat spike /data/runs.jsonl

  ingest:
    name: ingest tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: ingest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: "20"
      - name: Start Azurite (blob)
        if: runner.os == 'Linux'
        run: |
          npm install -g azurite@3
          azurite-blob --silent --blobHost 127.0.0.1 --blobPort 10000 --skipApiVersionCheck --location "$RUNNER_TEMP/azurite" &
          echo "AZURITE_BLOB_URL=http://127.0.0.1:10000/devstoreaccount1" >> "$GITHUB_ENV"
      - run: pip install -e ".[dev]"
      - name: pytest
        shell: bash
        run: |
          set -o pipefail
          pytest -q -rfEs --tb=short 2>&1 | tee pytest.log
      - name: Surface failures as annotations
        if: failure()
        shell: bash
        run: grep -E "^(FAILED|ERROR|E  )" pytest.log | head -40 | sed 's/^/::error::/'

  ingest-docker:
    name: ingest docker image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run tests in the image
        run: docker build --target test -t lichess-ingest:test .
      - name: Build runtime image and smoke test the CLI
        run: |
          docker compose build
          docker compose run --rm ingest --help

  spark:
    name: spark helpers tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: pytest (no Spark needed)
        run: PYTHONPATH=. pytest -q

  spark-docker:
    name: spark image + local-mode smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spark
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t lichess-spark:test .
      - name: Jars are in place
        run: docker run --rm --entrypoint bash lichess-spark:test -c "ls /opt/spark/jars | grep -E 'iceberg-spark-runtime-4.1|iceberg-azure-bundle|hadoop-azure-3.4'"
      - name: Smoke job in Spark local mode
        run: docker run --rm --entrypoint /opt/spark/bin/spark-submit lichess-spark:test --master 'local[2]' /opt/lichess/tests/local_smoke.py
      - name: Build notebook image
        run: docker build --target notebook -t lichess-notebook:test .
      - name: Notebook kernel can run Spark (local mode, plain python3)
        run: |
          docker run --rm lichess-notebook:test jupyter lab --version
          docker run --rm lichess-notebook:test python3 /opt/lichess/tests/local_notebook.py

  notebooks:
    name: notebooks have no outputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/check_notebooks.py
