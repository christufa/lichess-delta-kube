name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  spike-pgn-timing:
    name: spike/pgn_timing tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: spike/pgn_timing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[iceberg,pychess,dev]"
      - name: pytest
        shell: bash
        run: |
          set -o pipefail
          pytest -q -rfE --tb=short 2>&1 | tee pytest.log
      - name: Surface failures as annotations
        if: failure()
        shell: bash
        run: grep -E "^(FAILED|ERROR|E  )" pytest.log | head -40 | sed 's/^/::error::/'

  spike-docker:
    name: spike/pgn_timing docker image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spike/pgn_timing
    steps:
      - uses: actions/checkout@v4
      - name: Build and run tests in the image
        run: docker build --target test -t pgn-timing:test .
      - name: Build runtime image
        run: docker compose build
      - name: Smoke test parse and commit through compose
        run: |
          docker run --rm -v lichess-data:/data --entrypoint python pgn-timing:test -c "
          import random, sys, zstandard
          sys.path.insert(0, '/app/tests')
          from conftest import make_game
          rng = random.Random(0)
          text = ''.join(make_game(i, rng) for i in range(20000))
          open('/data/sample.pgn.zst', 'wb').write(zstandard.ZstdCompressor().compress(text.encode()))
          "
          docker compose run --rm spike --report /data/runs.jsonl parse /data/sample.pgn.zst --workers 2 --chunk-mb 4 --out /data/parquet \
            | python3 -c "import json,sys; r=json.load(sys.stdin); assert r['games'] == 20000, r; print(r['games'], 'games', r['games_per_s'], 'games/s')"
          docker compose run --rm spike commit /data/parquet --warehouse /data/warehouse \
            | python3 -c "import json,sys; r=json.load(sys.stdin); assert r['rows'] == 20000, r; print(r['rows'], 'rows committed')"
          docker compose run --rm --entrypoint cat spike /data/runs.jsonl

  ingest:
    name: ingest tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: ingest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: "20"
      - name: Start Azurite (blob)
        if: runner.os == 'Linux'
        run: |
          npm install -g azurite@3
          azurite-blob --silent --blobHost 127.0.0.1 --blobPort 10000 --skipApiVersionCheck --location "$RUNNER_TEMP/azurite" &
          echo "AZURITE_BLOB_URL=http://127.0.0.1:10000/devstoreaccount1" >> "$GITHUB_ENV"
      - run: pip install -e ".[dev]"
      - name: pytest
        shell: bash
        run: |
          set -o pipefail
          pytest -q -rfEs --tb=short 2>&1 | tee pytest.log
      - name: Surface failures as annotations
        if: failure()
        shell: bash
        run: grep -E "^(FAILED|ERROR|E  )" pytest.log | head -40 | sed 's/^/::error::/'

  spark:
    name: spark helpers tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: pytest (no Spark needed)
        run: PYTHONPATH=. pytest -q

  api:
    name: api tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff check .
      - name: pytest (Trino faked; includes the OpenAPI contract tests)
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q -rfE --tb=short 2>&1 | tee pytest.log
      - name: Surface failures as annotations
        if: failure()
        shell: bash
        run: grep -E "^(FAILED|ERROR|E  )" pytest.log | head -40 | sed 's/^/::error::/'

  mcp:
    name: mcp-server tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff check .
      - name: pytest (Trino faked; Entra tokens signed with a local key)
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q -rfE --tb=short 2>&1 | tee pytest.log
      - name: Surface failures as annotations
        if: failure()
        shell: bash
        run: grep -E "^(FAILED|ERROR|E  )" pytest.log | head -40 | sed 's/^/::error::/'

  # The OpenAPI spec is the API's contract (the dashboard's TypeScript client is generated
  # from it): regenerate it and fail if api/openapi.json wasn't updated with the code.
  api-openapi:
    name: api OpenAPI spec is committed and current
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          python-version: "3.13"
      - run: uv sync --locked --no-dev
      - name: Generate and compare
        run: uv run --no-dev python -m chess_api.openapi --check openapi.json

  # The dashboard (web/): its API client is generated from api/openapi.json and must be
  # current, so the app and the API can't drift. Then lint, typecheck, unit tests, and
  # Playwright smoke tests (with axe accessibility checks) on the production build with
  # the API mocked, at desktop and phone (375 px) sizes.
  web:
    name: web (dashboard) checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: API client is generated from api/openapi.json and committed
        run: npm run generate:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke tests + axe
        run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  notebooks:
    name: notebooks have no outputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/check_notebooks.py

  manifests:
    name: deploy manifests render and validate
    runs-on: ubuntu-24.04
    env:
      HELM_VERSION: v3.22.1
      KUBECONFORM_VERSION: v0.8.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install helm and kubeconform
        run: |
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar xz -C /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz -C /tmp
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform
      - run: .github/scripts/validate_manifests.sh

