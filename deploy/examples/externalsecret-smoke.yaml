# Check the Key Vault → Kubernetes path end to end. Not synced by Argo CD.
#   1. Key Vault → Secrets → Generate/Import: name "smoke-test", any value
#      (portal; your IP must be in the vault's firewall)
#   2. kubectl apply -f deploy/examples/externalsecret-smoke.yaml
#   3. kubectl get externalsecret -n lichess smoke-test      → STATUS SecretSynced
#      kubectl get secret -n lichess smoke-test -o jsonpath='{.data.value}'
#   4. kubectl delete -f deploy/examples/externalsecret-smoke.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: smoke-test
  namespace: lichess
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-key-vault
  target:
    name: smoke-test
  data:
    - secretKey: value
      remoteRef:
        key: smoke-test
