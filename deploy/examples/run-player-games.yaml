# Not synced by Argo CD: build lake.curated.player_games from lake.curated.games (write-audit-publish).
#   kubectl create -n lichess -f deploy/examples/run-player-games.yaml
# args: ["--pending"] = curated.games months not built yet or rebuilt since,
#       or ["--months", "2013-01,2013-02"].
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: player-games-
  namespace: lichess
spec:
  workflowTemplateRef:
    name: spark-job
  arguments:
    parameters:
      - name: job
        value: build_player_games
      - name: args
        value: '["--pending"]'
      - name: executors
        value: "2"
