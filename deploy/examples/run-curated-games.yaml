# Not synced by Argo CD: build lake.curated.games from lake.raw.games (write-audit-publish).
#   kubectl create -n lichess -f deploy/examples/run-curated-games.yaml
# args: ["--pending"] = raw months not built yet or republished since,
#       or ["--months", "2013-01,2013-02"].
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: curated-games-
  namespace: lichess
spec:
  workflowTemplateRef:
    name: spark-job
  arguments:
    parameters:
      - name: job
        value: build_curated_games
      - name: args
        value: '["--pending"]'
      - name: executors
        value: "2"
