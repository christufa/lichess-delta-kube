# Default-deny ingress for trino. Allowed in:
#   - pods in trino (coordinator ↔ workers)
#   - lichess → coordinator :8443 (notebooks, smoke workflow)
#   - chess-api → coordinator :8443 (the data API; Trino lets it read lake.gold only)
#   - chess-mcp → coordinator :8443 (the MCP server; lake.curated and lake.gold, read-only)
#   - kube-system → metrics (Azure Managed Prometheus), later
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: trino
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {} # any pod in this namespace
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-clients
  namespace: trino
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: trino
      app.kubernetes.io/component: coordinator
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: lichess
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: chess-api
            app.kubernetes.io/name: chess-api
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: chess-mcp
            app.kubernetes.io/name: chess-mcp
      toPorts:
        - ports:
            - { port: "8443", protocol: TCP }
