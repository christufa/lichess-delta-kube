# Default-deny ingress for the argocd namespace (Cilium). Once a pod is selected by a policy
# with an ingress section, everything not listed here is dropped. Egress is not restricted
# (yet): lake, ACR, Entra, chart repos and the LLM provider are reached directly.
#
# Allowed in:
#   - pods in argocd (server, repo-server, redis, controllers)
# `kubectl port-forward` enters the pod's network namespace through the kubelet and is not
# subject to policy, so the UIs keep working.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: argocd
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {} # any pod in this namespace
---
# The Argo CD UI (chess-cd) is published through the Cloudflare Tunnel: let cloudflared reach it on its
# container port. Cloudflare Access and cloudflared's token check sit in front.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-cloudflared
  namespace: argocd
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cloudflared
            app.kubernetes.io/name: cloudflared
      toPorts:
        - ports:
            - { port: "8080", protocol: TCP }
