# Default-deny ingress for monitoring; Grafana is reachable only from cloudflared
# (chess-grafana behind Cloudflare Access). Grafana trusts the Cloudflare email header, so
# this policy is what keeps anything else from sending it.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: monitoring
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {} # any pod in this namespace
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-cloudflared
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cloudflared
            app.kubernetes.io/name: cloudflared
      toPorts:
        - ports:
            - { port: "3000", protocol: TCP }
