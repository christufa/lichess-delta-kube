# Ingest one or more Lichess months into the lake (raw Parquet + manifests), on a
# spot batch node, signed in as the jobs identity (workload identity, no secrets),
# then publish them into the Iceberg table lake.raw.games (write-audit-publish:
# spark/jobs/register_raw_games.py), then build lake.curated.games, curated.player_games
# and the gold tables from them (spark/jobs/build_*.py). A month that fails its checks
# stays out of that table.
# Spot node, identity label, service account and log archiving come from the
# controller's workflowDefaults (deploy/apps/argo-workflows.yaml).
#
# Submit: deploy/examples/run-ingest-month.yaml, or "Submit" in the Argo UI.
#
# Safe to run alongside other runners (the PC, ingest-backfill): each month is
# claimed in the lake before it starts, and months claimed by someone else are skipped.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: ingest-month
  namespace: lichess
spec:
  entrypoint: ingest-and-publish
  activeDeadlineSeconds: 43200 # 12 h cap for the whole workflow
  arguments:
    parameters:
      - name: months
        description: "'2026-09', '2020', '2020-01:2020-12' or a comma-separated mix"
      - name: image-tag
        value: main
        description: lichess-ingest image tag in the cluster's ACR
      - name: workers
        value: "6"
        description: parser processes (the batch node has 8 vCPU)
      - name: download
        value: auto
        description: torrent, http, or auto (torrent; the image ships aria2c)
      - name: publish
        value: "true"
        description: publish landed months into lake.raw.games, then build curated and gold ("false" = land only)

  volumes:
    - name: work
      emptyDir:
        sizeLimit: 120Gi # downloads (~35 GB for the largest month) + Parquet staging

  templates:
    - name: ingest-and-publish
      inputs:
        parameters:
          - name: months
          - name: image-tag
          - name: workers
          - name: download
            value: auto
          - name: publish
            value: "true"
      steps:
        - - name: ingest
            template: ingest
            arguments:
              parameters:
                - { name: months, value: "{{inputs.parameters.months}}" }
                - { name: image-tag, value: "{{inputs.parameters.image-tag}}" }
                - { name: workers, value: "{{inputs.parameters.workers}}" }
                - { name: download, value: "{{inputs.parameters.download}}" }
        - - name: publish
            template: publish
            when: "{{inputs.parameters.publish}} == true"
        - - name: curate
            template: curate
            when: "{{inputs.parameters.publish}} == true"

    # One publisher at a time (parallel backfill months would race to fast-forward the
    # table's main branch). --pending publishes every landed month not in the table yet,
    # so whichever month's run gets the lock first also picks up the others' months.
    - name: publish
      synchronization:
        mutexes:
          - name: raw-games-publish
      steps:
        - - name: register
            templateRef:
              name: spark-job
              template: spark
            arguments:
              parameters:
                - { name: job, value: register_raw_games }
                - { name: args, value: '["--pending"]' }
                - { name: executors, value: "1" }
                - { name: image-tag, value: main }

    # Same pattern downstream, one builder at a time, each layer from the one before:
    # raw → curated.games → curated.player_games → gold. --pending builds every source month
    # that isn't in the table yet (or changed in its source since).
    - name: curate
      synchronization:
        mutexes:
          - name: curated-and-gold-publish
      steps:
        - - name: games
            templateRef:
              name: spark-job
              template: spark
            arguments:
              parameters:
                - { name: job, value: build_curated_games }
                - { name: args, value: '["--pending"]' }
                - { name: executors, value: "2" }
                - { name: image-tag, value: main }
        - - name: player-games
            templateRef:
              name: spark-job
              template: spark
            arguments:
              parameters:
                - { name: job, value: build_player_games }
                - { name: args, value: '["--pending"]' }
                - { name: executors, value: "2" }
                - { name: image-tag, value: main }
        - - name: gold
            templateRef:
              name: spark-job
              template: spark
            arguments:
              parameters:
                - { name: job, value: build_gold }
                - { name: args, value: '["--pending"]' }
                - { name: executors, value: "2" }
                - { name: image-tag, value: main }

    - name: ingest
      inputs:
        parameters:
          - name: months
          - name: image-tag
          - name: workers
          - name: download
            value: auto
          - name: registry
            valueFrom:
              configMapKeyRef: { name: lichess-config, key: ACR_LOGIN_SERVER }
      # Retry when the pod is lost (spot eviction, node problems), not when the code
      # fails: ingest is idempotent, so a retried month starts over cleanly.
      retryStrategy:
        limit: "3"
        retryPolicy: OnError
        backoff: { duration: 1m, factor: "2", maxDuration: 30m }
      # Pod Security "restricted" (#62): the image's ingest user by number, so the kubelet can
      # verify it isn't root (the image says USER ingest; numeric from the next build on).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      container:
        image: "{{inputs.parameters.registry}}/lichess-ingest:{{inputs.parameters.image-tag}}"
        args:
          - --months
          - "{{inputs.parameters.months}}"
          - run
          - --work
          - /work
          - --workers
          - "{{inputs.parameters.workers}}"
          - --download-method
          - "{{inputs.parameters.download}}"
          # Stable across retries of this step, so a retried pod reclaims its own month
          # instead of waiting for the claim to expire.
          - --owner
          - "{{workflow.name}}-{{inputs.parameters.months}}"
        envFrom:
          - configMapRef:
              name: lichess-config # LICHESS_DEST (Terraform, infra/gitops)
        volumeMounts:
          - { name: work, mountPath: /work }
        resources:
          requests: { cpu: "6", memory: 16Gi, ephemeral-storage: 100Gi }
          limits: { memory: 48Gi }
