# One-time (idempotent) Lakekeeper setup: bootstrap the server, then create the warehouse
# "lichess" over the lake. The warehouse's base location is LICHESS_DEST, so the raw
# Parquet already landed under it can become Iceberg tables in place (#23). Storage access
# uses Lakekeeper's own workload identity; clients get table-scoped SAS tokens.
#
#   kubectl create -n lichess -f deploy/examples/run-lakekeeper-bootstrap.yaml
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: lakekeeper-bootstrap
  namespace: lichess
spec:
  entrypoint: bootstrap
  templates:
    - name: bootstrap
      nodeSelector:
        kubernetes.azure.com/agentpool: system # a few HTTP calls: no spot node needed
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: { type: RuntimeDefault }
      script:
        image: python:3.13-alpine
        command: [python3]
        envFrom:
          - configMapRef:
              name: lichess-config # LICHESS_DEST, LICHESS_CATALOG_URI, LICHESS_WAREHOUSE
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
        resources:
          requests: { cpu: 10m, memory: 32Mi }
        source: |
          import json, os, sys, urllib.error, urllib.parse, urllib.request

          base = os.environ["LICHESS_CATALOG_URI"].rsplit("/catalog", 1)[0]
          name = os.environ["LICHESS_WAREHOUSE"]
          dest = urllib.parse.urlparse(os.environ["LICHESS_DEST"])  # abfss://<container>@<account>.dfs.core.windows.net/<prefix>
          container, host = dest.netloc.split("@", 1)
          account, prefix = host.split(".", 1)[0], dest.path.strip("/")

          def call(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(base + path, data=data, method=method,
                                           headers={"Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      raw = r.read()
                      return r.status, json.loads(raw) if raw else None
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()

          status, info = call("GET", "/management/v1/info")
          print("server info:", status, info)
          if status != 200:
              sys.exit("Lakekeeper is not reachable")
          if not info.get("bootstrapped"):
              print("bootstrap:", *call("POST", "/management/v1/bootstrap", {"accept-terms-of-use": True}))

          status, listing = call("GET", "/management/v1/warehouse")
          names = [w["name"] for w in (listing or {}).get("warehouses", [])] if status == 200 else []
          if name in names:
              print(f"warehouse {name} exists")
          else:
              status, body = call("POST", "/management/v1/warehouse", {
                  "warehouse-name": name,
                  "storage-profile": {
                      "type": "adls",
                      "account-name": account,
                      "filesystem": container,
                      "key-prefix": prefix,
                      "sas-token-validity-seconds": 3600,
                  },
                  "storage-credential": {"type": "az", "credential-type": "azure-system-identity"},
                  "delete-profile": {"type": "soft", "expiration-seconds": 604800},
              })
              print("create warehouse:", status, body)
              if status not in (200, 201):
                  sys.exit(1)
          print(f"ready: warehouse {name} at abfss://{container}@{account}.dfs.core.windows.net/{prefix}")
