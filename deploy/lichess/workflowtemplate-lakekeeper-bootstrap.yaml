# One-time (idempotent) Lakekeeper setup: bootstrap the server, then create the warehouse
# "lichess" over the lake. The warehouse's base location is LICHESS_DEST, so the raw
# Parquet already landed under it can become Iceberg tables in place (#23). Storage access
# uses Lakekeeper's own workload identity; clients get table-scoped SAS tokens.
# Calls are authenticated with this pod's service account token (lichess-jobs), which
# bootstraps as operator and is instance admin (LAKEKEEPER__INSTANCE_ADMINS).
# Then it provisions the read-only users (parameter `readers`) and grants them describe +
# select on the default project: they can read every table and change nothing.
#
#   kubectl create -n lichess -f deploy/examples/run-lakekeeper-bootstrap.yaml
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: lakekeeper-bootstrap
  namespace: lichess
spec:
  entrypoint: bootstrap
  arguments:
    parameters:
      - name: readers
        value: "system:serviceaccount:trino:trino"
        description: comma-separated service accounts that get read-only access to the catalog
  templates:
    - name: bootstrap
      inputs:
        parameters:
          - name: readers
      nodeSelector:
        kubernetes.azure.com/agentpool: system # a few HTTP calls: no spot node needed
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: { type: RuntimeDefault }
      script:
        image: python:3.13-alpine
        command: [python3]
        env:
          - name: READERS
            value: "{{inputs.parameters.readers}}"
        envFrom:
          - configMapRef:
              name: lichess-config # LICHESS_DEST, LICHESS_CATALOG_URI, LICHESS_WAREHOUSE
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
        resources:
          requests: { cpu: 10m, memory: 32Mi }
        source: |
          import json, os, sys, urllib.error, urllib.parse, urllib.request

          base = os.environ["LICHESS_CATALOG_URI"].rsplit("/catalog", 1)[0]
          name = os.environ["LICHESS_WAREHOUSE"]
          dest = urllib.parse.urlparse(os.environ["LICHESS_DEST"])  # abfss://<container>@<account>.dfs.core.windows.net/<prefix>
          container, host = dest.netloc.split("@", 1)
          account, prefix = host.split(".", 1)[0], dest.path.strip("/")

          token = open("/var/run/secrets/kubernetes.io/serviceaccount/token").read().strip()

          def call(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(base + path, data=data, method=method,
                                           headers={"Content-Type": "application/json",
                                                    "Authorization": f"Bearer {token}"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      raw = r.read()
                      return r.status, json.loads(raw) if raw else None
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()

          status, info = call("GET", "/management/v1/info")
          print("server info:", status, info)
          if status != 200:
              sys.exit("Lakekeeper is not reachable")
          if not info.get("bootstrapped"):
              print("bootstrap:", *call("POST", "/management/v1/bootstrap",
                                        {"accept-terms-of-use": True, "is-operator": True}))

          status, listing = call("GET", "/management/v1/warehouse")
          names = [w["name"] for w in (listing or {}).get("warehouses", [])] if status == 200 else []
          if name in names:
              print(f"warehouse {name} exists")
          else:
              status, body = call("POST", "/management/v1/warehouse", {
                  "warehouse-name": name,
                  "storage-profile": {
                      "type": "adls",
                      "account-name": account,
                      "filesystem": container,
                      "key-prefix": prefix,
                      "sas-token-validity-seconds": 3600,
                  },
                  "storage-credential": {"type": "az", "credential-type": "azure-system-identity"},
                  "delete-profile": {"type": "soft", "expiration-seconds": 604800},
              })
              print("create warehouse:", status, body)
              if status not in (200, 201):
                  sys.exit(1)
          # Read-only users: provision them, then describe + select on the project.
          readers = [f"kubernetes~{r.strip()}" for r in os.environ.get("READERS", "").split(",") if r.strip()]
          status, current = call("GET", "/management/v1/permissions/project/assignments")
          have = {(a.get("user"), a.get("type")) for a in (current or {}).get("assignments", [])} if status == 200 else set()
          writes = []
          for user in readers:
              status, body = call("POST", "/management/v1/user", {
                  "id": user, "name": user.split("~", 1)[1], "user-type": "application", "update-if-exists": True})
              print("provision user:", user, status)
              writes += [{"type": t, "user": user} for t in ("describe", "select") if (user, t) not in have]
          if writes:
              status, body = call("POST", "/management/v1/permissions/project/assignments", {"writes": writes, "deletes": []})
              print("grant read:", status, body)
              if status not in (200, 204):
                  sys.exit(1)
          print(f"ready: warehouse {name} at abfss://{container}@{account}.dfs.core.windows.net/{prefix}; readers {readers or 'none'}")
