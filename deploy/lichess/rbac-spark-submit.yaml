# Lets workflows (running as lichess-jobs) submit and watch SparkApplications.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-submit
  namespace: lichess
rules:
  - apiGroups: [sparkoperator.k8s.io]
    resources: [sparkapplications]
    verbs: [create, get, list, watch, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-submit
  namespace: lichess
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spark-submit
subjects:
  - kind: ServiceAccount
    name: lichess-jobs
    namespace: lichess
