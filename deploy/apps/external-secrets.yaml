# External Secrets Operator: syncs secrets from Azure Key Vault into Kubernetes Secrets.
# Key Vault access is configured in deploy/charts/platform (ClusterSecretStore).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: lichess
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.13.0
    helm:
      releaseName: external-secrets
      valuesObject:
        installCRDs: true
        resources:
          requests: { cpu: 20m, memory: 64Mi }
        webhook:
          resources:
            requests: { cpu: 10m, memory: 32Mi }
        certController:
          resources:
            requests: { cpu: 10m, memory: 32Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets # created by infra/gitops with the Key Vault service account
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true # large CRDs
    retry:
      limit: 5
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
