# chess-web (deploy/charts/chess-web): the public dashboard (web/, #67), static files on
# unprivileged nginx. Reads nothing itself: the browser calls chess-api at /api/v1.
# - Network: only cloudflared may connect, and it has no egress at all
#   (deploy/network-policies/chess-web.yaml). Public at chess.<domain>/ through the
#   route in infra/gitops/edge.tf (after the /api/ route).
# - Image lichess-web from the cluster's ACR, built and signed by images.yml. New builds
#   roll out without kubectl: after each signed main build, images.yml commits its digest
#   to the deploy-state branch (chess-web.yaml). The git generator below reads that file and
#   puts the digest into the Helm values, so a new build is a manifest change Argo CD syncs
#   (deploy/README.md, "Rolling out new builds"). Not a second source: Argo CD can't mix two
#   revisions (main, deploy-state) of one repository in an Application.
# ApplicationSet so the registry comes from the cluster facts.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: chess-web
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  lichess.generops.dev/facts: "true"
          - git: # image.digest + image.commit of the newest signed main build (images.yml)
              repoURL: https://github.com/christufa/lichess-delta-kube.git
              revision: deploy-state
              files:
                - path: chess-web.yaml
  # If the file ever went missing, the generator would yield nothing: keep the Application
  # (and its workloads) rather than deleting them.
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: chess-web
      annotations:
        argocd.argoproj.io/sync-wave: "3" # with chess-api
    spec:
      project: lichess
      source:
        repoURL: https://github.com/christufa/lichess-delta-kube.git
        targetRevision: main
        path: deploy/charts/chess-web
        helm:
          valuesObject:
            acrLoginServer: '{{ index .metadata.annotations "lichess.generops.dev/acr-login-server" }}'
            image:
              digest: '{{ .image.digest }}'
              commit: '{{ .image.commit }}'
      destination:
        server: '{{ .server }}'
        namespace: chess-web
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        managedNamespaceMetadata:
          labels: # Pod Security Admission (#62): only pods meeting "restricted" may run here
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/enforce-version: latest
            pod-security.kubernetes.io/warn: restricted
            pod-security.kubernetes.io/audit: restricted
        retry:
          limit: 10
          backoff: { duration: 30s, factor: 2, maxDuration: 5m }
