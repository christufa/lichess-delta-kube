# chess-web (deploy/charts/chess-web): the public dashboard (web/, #67), static files on
# unprivileged nginx. Reads nothing itself: the browser calls chess-api at /api/v1.
# - Network: only cloudflared may connect, and it has no egress at all
#   (deploy/network-policies/chess-web.yaml). Public at chess.<domain>/ through the
#   route in infra/gitops/edge.tf (after the /api/ route).
# - Image lichess-web from the cluster's ACR, built and signed by images.yml. New builds
#   roll out without kubectl: after each signed main build, images.yml commits its digest
#   to the deploy-state branch (chess-web.yaml), read here as a second source, so a new
#   build is a manifest change Argo CD syncs (deploy/README.md, "Rolling out new builds").
# ApplicationSet so the registry comes from the cluster facts.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: chess-web
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            lichess.generops.dev/facts: "true"
  template:
    metadata:
      name: chess-web
      annotations:
        argocd.argoproj.io/sync-wave: "3" # with chess-api
    spec:
      project: lichess
      sources:
        - repoURL: https://github.com/christufa/lichess-delta-kube.git
          targetRevision: main
          path: deploy/charts/chess-web
          helm:
            valueFiles:
              - $state/chess-web.yaml # image.digest + image.commit, written by images.yml
            ignoreMissingValueFiles: true # no file yet: the chart falls back to :main
            valuesObject:
              acrLoginServer: '{{ index .metadata.annotations "lichess.generops.dev/acr-login-server" }}'
        - repoURL: https://github.com/christufa/lichess-delta-kube.git
          targetRevision: deploy-state # only images.yml pushes here; main stays PR-only
          ref: state
      destination:
        server: '{{ .server }}'
        namespace: chess-web
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        managedNamespaceMetadata:
          labels: # Pod Security Admission (#62): only pods meeting "restricted" may run here
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/enforce-version: latest
            pod-security.kubernetes.io/warn: restricted
            pod-security.kubernetes.io/audit: restricted
        retry:
          limit: 10
          backoff: { duration: 30s, factor: 2, maxDuration: 5m }
