# Argo CD project for everything in this repository. Applications for the pipeline
# (Argo Workflows, workflow templates, …) are added next to this file and use
# `project: lichess`.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: lichess
  namespace: argocd
spec:
  description: Lichess data platform (christufa/lichess-delta-kube)
  sourceRepos:
    - https://github.com/christufa/lichess-delta-kube.git
    - https://argoproj.github.io/argo-helm
    - https://kubeflow.github.io/spark-operator
    - https://charts.external-secrets.io
    - https://kyverno.github.io/kyverno
    - https://grafana-community.github.io/helm-charts
    - https://cloudnative-pg.github.io/charts
    - https://lakekeeper.github.io/lakekeeper-charts
    - https://charts.jetstack.io
    - https://trinodb.github.io/charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argo
    - server: https://kubernetes.default.svc
      namespace: lichess
    - server: https://kubernetes.default.svc
      namespace: spark-operator
    - server: https://kubernetes.default.svc
      namespace: external-secrets
    - server: https://kubernetes.default.svc
      namespace: kyverno
    - server: https://kubernetes.default.svc
      namespace: cloudflared
    - server: https://kubernetes.default.svc
      namespace: monitoring
    - server: https://kubernetes.default.svc
      namespace: cnpg-system
    - server: https://kubernetes.default.svc
      namespace: lakekeeper
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: trino
  # Charts like Argo Workflows install CRDs and cluster roles.
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
