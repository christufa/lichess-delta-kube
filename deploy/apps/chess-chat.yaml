# chess-chat (deploy/charts/chess-chat): the chat backend (chat/, #69).
# - Public at https://chess.<domain>/api/v1/chat (infra/gitops/edge.tf); every request needs an
#   Entra token with app role Chat.User on the "chess Chat" app (infra/gitops/chat.tf).
# - Reads the lakehouse only through the MCP server, as its managed identity (workload identity,
#   app role Lakehouse.Query on the MCP app). The model's API key comes from Key Vault.
# - Network: only cloudflared may connect; it may call the MCP server, DNS, and HTTPS out (the
#   model provider and Entra) (deploy/network-policies/chess-chat.yaml).
# - Image lichess-chat from the cluster's ACR, built and signed by images.yml. New builds
#   roll out without kubectl: after each signed main build, images.yml commits its digest
#   to the deploy-state branch (chess-chat.yaml). The git generator below reads that file and
#   puts the digest into the Helm values, so a new build is a manifest change Argo CD syncs
#   (deploy/README.md, "Rolling out new builds"). Not a second source: Argo CD can't mix two
#   revisions (main, deploy-state) of one repository in an Application.
# ApplicationSet so the registry, Entra apps and identity come from the cluster facts.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: chess-chat
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  lichess.generops.dev/facts: "true"
          - git: # image.digest + image.commit of the newest signed main build (images.yml)
              repoURL: https://github.com/christufa/lichess-delta-kube.git
              revision: deploy-state
              files:
                - path: chess-chat.yaml
  # If the file ever went missing, the generator would yield nothing: keep the Application
  # (and its workloads) rather than deleting them.
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: chess-chat
      annotations:
        argocd.argoproj.io/sync-wave: "3" # with Trino, after the CA bundle (wave 2)
    spec:
      project: lichess
      source:
        repoURL: https://github.com/christufa/lichess-delta-kube.git
        targetRevision: main
        path: deploy/charts/chess-chat
        helm:
          valuesObject:
            acrLoginServer: '{{ index .metadata.annotations "lichess.generops.dev/acr-login-server" }}'
            identityClientId: '{{ index .metadata.annotations "lichess.generops.dev/chat-identity-id" }}'
            entra:
              tenantId: '{{ index .metadata.annotations "lichess.generops.dev/tenant-id" }}'
              chatClientId: '{{ index .metadata.annotations "lichess.generops.dev/chat-client-id" }}'
              mcpClientId: '{{ index .metadata.annotations "lichess.generops.dev/mcp-client-id" }}'
            image:
              digest: '{{ .image.digest }}'
              commit: '{{ .image.commit }}'
      destination:
        server: '{{ .server }}'
        namespace: chess-chat
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        managedNamespaceMetadata:
          labels: # Pod Security Admission (#62): only pods meeting "restricted" may run here
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/enforce-version: latest
            pod-security.kubernetes.io/warn: restricted
            pod-security.kubernetes.io/audit: restricted
        retry:
          limit: 10
          backoff: { duration: 30s, factor: 2, maxDuration: 5m }
