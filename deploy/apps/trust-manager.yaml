# trust-manager: copies the private CA's certificate (public part only) into a ConfigMap
# internal-ca in every namespace, so clients can verify in-cluster TLS (Trino).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trust-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: lichess
  source:
    repoURL: https://charts.jetstack.io
    chart: trust-manager
    targetRevision: v0.24.0
    helm:
      releaseName: trust-manager
      valuesObject:
        crds:
          enabled: true
        app:
          trust:
            namespace: cert-manager # where the CA secret lives
        resources:
          requests: { cpu: 10m, memory: 32Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
