# Lakekeeper: the Iceberg REST catalog (lake.raw.*, lake.curated.*, lake.gold.*).
# - Signs in to the lake with workload identity (id-lichess-lakekeeper) and vends
#   short-lived, table-scoped SAS tokens to Spark/Trino.
# - Database: CloudNativePG cluster lakekeeper-pg (deploy/lakekeeper).
# - Authentication: Kubernetes service account tokens, checked with the TokenReview API.
#   Callers appear as kubernetes~system:serviceaccount:<namespace>:<name>.
# - Authorization: OpenFGA (subchart, its own CloudNativePG database). lichess-jobs (Spark
#   jobs, workflows, notebooks) is instance admin; Trino gets read access when it arrives.
# - Network: reachable only from lichess and, later, Trino (deploy/network-policies/lakekeeper.yaml).
# ApplicationSet so the identity's client ID comes from the cluster facts.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: lakekeeper
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            lichess.generops.dev/facts: "true"
  template:
    metadata:
      name: lakekeeper
      annotations:
        argocd.argoproj.io/sync-wave: "2"
    spec:
      project: lichess
      source:
        repoURL: https://lakekeeper.github.io/lakekeeper-charts
        chart: lakekeeper
        targetRevision: 0.12.0 # Lakekeeper 0.13.3
        helm:
          releaseName: lakekeeper
          valuesObject:
            catalog:
              replicas: 1
              podLabels:
                azure.workload.identity/use: "true"
              nodeSelector:
                kubernetes.azure.com/agentpool: system
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { memory: 512Mi }
              podSecurityContext:
                runAsNonRoot: true
                seccompProfile: { type: RuntimeDefault }
              containerSecurityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
              config:
                LAKEKEEPER__ENABLE_AZURE_SYSTEM_CREDENTIALS: "true"
                LAKEKEEPER__KUBERNETES_AUTHENTICATION_SUBJECT_SOURCE: username
                LAKEKEEPER__INSTANCE_ADMINS: '["kubernetes~system:serviceaccount:lichess:lichess-jobs"]' 
            serviceAccount:
              create: true
              name: lakekeeper
              annotations:
                azure.workload.identity/client-id: '{{ index .metadata.annotations "lichess.generops.dev/lakekeeper-client-id" }}'
            secretBackend:
              type: Postgres
              postgres:
                encryptionKeySecret: lakekeeper-encryption
                encryptionKeySecretKey: password
            postgresql:
              enabled: false
            externalDatabase:
              type: postgres
              host_read: lakekeeper-catalog-pg-rw
              host_write: lakekeeper-catalog-pg-rw
              port: 5432
              database: catalog
              userSecret: lakekeeper-catalog-pg-app
              userSecretKey: username
              passwordSecret: lakekeeper-catalog-pg-app
              passwordSecretKey: password
            auth:
              k8s:
                enabled: true
                createClusterRoleBinding: true # system:auth-delegator for TokenReview
            authz:
              backend: openfga
            internalOpenFGA: true
            openfga:
              replicaCount: 1
              datastore:
                engine: postgres
                migrationType: initContainer
                uriSecret: openfga-pg-app # CloudNativePG app secret, key "uri"
              postgresql:
                enabled: false # the chart's bundled Postgres; we use CloudNativePG
              nodeSelector:
                kubernetes.azure.com/agentpool: system
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { memory: 512Mi }
      destination:
        server: '{{ .server }}'
        namespace: lakekeeper
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 10
          backoff: { duration: 30s, factor: 2, maxDuration: 5m }
