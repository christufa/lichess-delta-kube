# PodMonitors for Azure Managed Prometheus (deploy/monitoring).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: observability
  source:
    repoURL: https://github.com/christufa/lichess-delta-kube.git
    targetRevision: main
    path: deploy/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true # the azmonitoring CRDs come with the AKS metrics add-on
    retry:
      limit: 10
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
