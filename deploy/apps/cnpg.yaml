# CloudNativePG: the Postgres operator. Runs Lakekeeper's catalog database
# (deploy/lakekeeper/postgres.yaml) as a Kubernetes-native cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: lichess
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: 0.29.1 # CloudNativePG 1.30.1
    helm:
      releaseName: cnpg
      valuesObject:
        crds:
          create: true
        resources:
          requests: { cpu: 20m, memory: 64Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # large CRDs
    retry:
      limit: 5
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
