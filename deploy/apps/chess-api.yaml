# chess-api (deploy/charts/chess-api): the data API over lake.gold for the public dashboard.
# - Signs in to Trino as chess-api with a projected service account token (audience trino);
#   Trino's rules (apps/trino.yaml) let it read lake.gold and nothing else.
# - Network: only cloudflared may connect, and it may only call Trino and DNS
#   (deploy/network-policies/chess-api.yaml). Not routed publicly yet: the
#   chess.generops.dev/api route is added in infra/gitops/edge.tf (#45).
# - Image lichess-api:main from the cluster's ACR, built and signed by images.yml.
#   Argo CD doesn't see :main move; roll out a new build with
#     kubectl rollout restart deploy/chess-api -n chess-api
# ApplicationSet so the registry comes from the cluster facts.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: chess-api
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            lichess.generops.dev/facts: "true"
  template:
    metadata:
      name: chess-api
      annotations:
        argocd.argoproj.io/sync-wave: "3" # with Trino, after the CA bundle (wave 2)
    spec:
      project: lichess
      source:
        repoURL: https://github.com/christufa/lichess-delta-kube.git
        targetRevision: main
        path: deploy/charts/chess-api
        helm:
          valuesObject:
            acrLoginServer: '{{ index .metadata.annotations "lichess.generops.dev/acr-login-server" }}'
      destination:
        server: '{{ .server }}'
        namespace: chess-api
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 10
          backoff: { duration: 30s, factor: 2, maxDuration: 5m }
