# chess-api (deploy/charts/chess-api): the data API over lake.gold for the public dashboard.
# - Signs in to Trino as chess-api with a projected service account token (audience trino);
#   Trino's rules (apps/trino.yaml) let it read lake.gold and nothing else.
# - Network: only cloudflared may connect, and it may only call Trino and DNS
#   (deploy/network-policies/chess-api.yaml). Not routed publicly yet: the
#   chess.generops.dev/api route is added in infra/gitops/edge.tf (#45).
# - Image lichess-api from the cluster's ACR, built and signed by images.yml. New builds
#   roll out without kubectl: after each signed main build, images.yml commits its digest
#   to the deploy-state branch (chess-api.yaml), read here as a second source, so a new
#   build is a manifest change Argo CD syncs (deploy/README.md, "Rolling out new builds").
# ApplicationSet so the registry comes from the cluster facts.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: chess-api
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            lichess.generops.dev/facts: "true"
  template:
    metadata:
      name: chess-api
      annotations:
        argocd.argoproj.io/sync-wave: "3" # with Trino, after the CA bundle (wave 2)
    spec:
      project: lichess
      sources:
        - repoURL: https://github.com/christufa/lichess-delta-kube.git
          targetRevision: main
          path: deploy/charts/chess-api
          helm:
            valueFiles:
              - $state/chess-api.yaml # image.digest + image.commit, written by images.yml
            ignoreMissingValueFiles: true # no file yet: the chart falls back to :main
            valuesObject:
              acrLoginServer: '{{ index .metadata.annotations "lichess.generops.dev/acr-login-server" }}'
        - repoURL: https://github.com/christufa/lichess-delta-kube.git
          targetRevision: deploy-state # only images.yml pushes here; main stays PR-only
          ref: state
      destination:
        server: '{{ .server }}'
        namespace: chess-api
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        managedNamespaceMetadata:
          labels: # Pod Security Admission (#62): only pods meeting "restricted" may run here
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/enforce-version: latest
            pod-security.kubernetes.io/warn: restricted
            pod-security.kubernetes.io/audit: restricted
        retry:
          limit: 10
          backoff: { duration: 30s, factor: 2, maxDuration: 5m }
