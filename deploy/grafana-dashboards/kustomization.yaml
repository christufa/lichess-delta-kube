# Grafana dashboards kept as JSON in git (#31), mounted into Grafana's "Lichess" folder
# (deploy/apps/grafana.yaml: dashboardsConfigMaps). A ConfigMap volume updates in place and
# Grafana rescans the folder, so a merged change shows up without a restart.
# lichess-workflows.json is generated by lichess_workflows.py: change the script, rerun it and
# commit both, rather than hand-editing panel JSON.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
generatorOptions:
  disableNameSuffixHash: true # Grafana's chart mounts it by this exact name
  labels:
    app.kubernetes.io/part-of: grafana
configMapGenerator:
  - name: grafana-dashboards-lichess
    files:
      - lichess-workflows.json
