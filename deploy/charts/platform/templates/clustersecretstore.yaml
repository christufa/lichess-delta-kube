# Key Vault as the source of every secret in the cluster. ExternalSecrets in any
# namespace refer to it by name (azure-key-vault); ESO signs in as the
# {{ .Values.eso.serviceAccount }} service account (workload identity → id-lichess-eso,
# Key Vault Secrets User).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-key-vault
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: {{ required "keyVaultUrl is required" .Values.keyVaultUrl | quote }}
      tenantId: {{ required "tenantId is required" .Values.tenantId | quote }}
      serviceAccountRef:
        name: {{ .Values.eso.serviceAccount }}
        namespace: {{ .Values.eso.namespace }}
