# Filled in by the `platform` ApplicationSet from the in-cluster Argo CD cluster secret
# (infra/gitops/platform.tf). Empty values fail rendering on purpose.
keyVaultUrl: ""
tenantId: ""
acrLoginServer: ""
eso:
  namespace: external-secrets
  serviceAccount: eso-azure-kv

# Signature check for our images (templates/image-verification.yaml).
imageVerification:
  enabled: true
  validationActions: [Audit] # → [Deny] once reports show every lichess-* pod passes
  failurePolicy: Ignore      # → Fail together with Deny
  signerIdentity: https://github.com/christufa/lichess-delta-kube/.github/workflows/images.yml@refs/heads/main
