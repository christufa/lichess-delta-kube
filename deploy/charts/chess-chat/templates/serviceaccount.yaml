# The chat backend's identity: workload identity federates this service account with the managed
# identity id-<project>-chat (infra/compute/chat.tf), which may use the MCP server (app role
# Lakehouse.Query) and nothing else. The Kubernetes API isn't needed, so its token isn't mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chess-chat
  labels:
    app.kubernetes.io/name: chess-chat
  annotations:
    azure.workload.identity/client-id: {{ required "identityClientId is required" .Values.identityClientId | quote }}
automountServiceAccountToken: false
