apiVersion: v1
kind: Service
metadata:
  name: chess-api
  labels:
    app.kubernetes.io/name: chess-api
spec:
  selector:
    app.kubernetes.io/name: chess-api
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: chess-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chess-api
