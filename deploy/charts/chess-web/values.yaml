# Filled in by the `chess-web` ApplicationSet from the in-cluster Argo CD cluster secret.
# Empty values fail rendering on purpose.
acrLoginServer: ""

image:
  repository: lichess-web # lichess-*: Kyverno checks its cosign signature (charts/platform)
  tag: main # or a commit SHA to pin an exact build

replicas: 2

resources:
  requests: { cpu: 10m, memory: 16Mi }
  limits: { memory: 64Mi }
