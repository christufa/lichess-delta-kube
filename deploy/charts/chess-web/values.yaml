# Filled in by the `chess-web` ApplicationSet from the in-cluster Argo CD cluster secret.
# Empty values fail rendering on purpose.
acrLoginServer: ""

# The chat panel's sign-in (#69), served as /config.json. Empty: the panel says the chat isn't
# set up here.
chat:
  tenantId: ""
  clientId: "" # the "chess Chat" app (infra/gitops/chat.tf)

image:
  repository: lichess-web # lichess-*: Kyverno checks its cosign signature (charts/platform)
  tag: main # used only while no digest is set
  # Set by CI, not here: images.yml records every signed main build (digest + commit) on
  # the deploy-state branch, which the ApplicationSet reads as a values file (deploy/README.md).
  digest: ""
  commit: ""

replicas: 2

resources:
  requests: { cpu: 10m, memory: 16Mi }
  limits: { memory: 64Mi }
