# chess-web: nginx serving the dashboard's static build on :8080. cloudflared sends
# chess.<domain>/ here (/api/ goes to chess-api); /healthz is only for the kubelet.
# /config.json (the chat's sign-in settings, deployment-specific) comes from the ConfigMap below.
{{- $chat := and .Values.chat.tenantId .Values.chat.clientId }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chess-web
  labels:
    app.kubernetes.io/name: chess-web
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: chess-web
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chess-web
      annotations:
        {{- with .Values.image.commit }}
        lichess.generops.dev/commit: {{ . | quote }} # the main commit the image was built from
        {{- end }}
        checksum/config: {{ include "chess-web.config" . | sha256sum }} # a subPath mount isn't refreshed: restart
    spec:
      serviceAccountName: chess-web
      automountServiceAccountToken: false
      enableServiceLinks: false # no <SERVICE>_PORT=tcp://… variables: they collide with app settings
      nodeSelector:
        kubernetes.azure.com/agentpool: system
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: chess-web
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # nginx in nginx-unprivileged
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 15
      containers:
        - name: web
          {{- $image := printf "%s/%s" (required "acrLoginServer is required" .Values.acrLoginServer) .Values.image.repository }}
          {{- if .Values.image.digest }}
          {{- if not (regexMatch "^sha256:[0-9a-f]{64}$" .Values.image.digest) }}{{ fail "image.digest must be sha256:<64 hex>" }}{{ end }}
          image: {{ printf "%s@%s" $image .Values.image.digest | quote }} # a new build changes this, so Argo CD rolls it out
          imagePullPolicy: IfNotPresent
          {{- else }}
          image: {{ printf "%s:%s" $image .Values.image.tag | quote }}
          imagePullPolicy: Always # :main moves; Kyverno pins each pod to the signed digest
          {{- end }}
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp } # nginx's pid and temp files
            {{- if $chat }}
            - { name: config, mountPath: /usr/share/nginx/html/config.json, subPath: config.json, readOnly: true }
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 16Mi }
        {{- if $chat }}
        - name: config
          configMap: { name: chess-web-config }
        {{- end }}
{{- if $chat }}
---
# The chat panel's sign-in settings (#69), read by the browser: not secrets (they're in every
# Entra sign-in URL), but deployment-specific, so they come from the cluster facts.
apiVersion: v1
kind: ConfigMap
metadata:
  name: chess-web-config
  labels:
    app.kubernetes.io/name: chess-web
data:
  config.json: {{ include "chess-web.config" . | quote }}
{{- end }}
