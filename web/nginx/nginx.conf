# The dashboard's static files (lichess-web). Runs as uid 101 with a read-only root
# filesystem: everything nginx writes (pid, temp files) goes to /tmp, an emptyDir in the
# cluster. cloudflared sends chess.<domain>/ here; /api/ goes straight to chess-api.
worker_processes 1;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format main '$http_cf_connecting_ip "$request" $status $body_bytes_sent $request_time "$http_user_agent"';
  access_log /dev/stdout main;

  sendfile on;
  server_tokens off;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  server {
    listen 8080;
    root /usr/share/nginx/html;

    include /etc/nginx/security-headers.conf;

    # Probes (kubelet only).
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Content-hashed by Vite: cache forever.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      include /etc/nginx/security-headers.conf; # add_header here drops the server's
      try_files $uri =404;
    }

    # The API is routed by cloudflared before it gets here; never answer it with the app.
    location /api/ {
      return 404;
    }

    # Client-side routes (/openings, …) all load index.html, which is never cached so a
    # new build shows up on the next visit.
    location / {
      add_header Cache-Control "no-cache" always;
      include /etc/nginx/security-headers.conf;
      try_files $uri /index.html;
    }
  }
}
