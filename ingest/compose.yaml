name: lichess-ingest

services:
  ingest:
    build:
      context: .
      target: runtime
    image: lichess-ingest:local
    env_file:
      - path: .env        # LICHESS_DEST and Azure credentials; see .env.example
        required: false
    volumes:
      # Scratch for downloads and staging (named volume: fast, inside Docker's disk).
      - lichess-work:/work

volumes:
  lichess-work:
    name: lichess-work
