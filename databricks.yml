bundle:
  name: lichess-games-download
include:
- resources/*.yml
variables:
  catalog:
    description: Existing Unity Catalog catalog
    default: brikt
  schema:
    default: lichess
  volume:
    default: staging
  table:
    default: games
  hf_repo:
    default: christopher3/lichess-games
  hf_secret_scope:
    default: lichess
  hf_secret_key:
    default: hf-token
  schedule_status:
    description: Whether the monthly schedule is active
    default: PAUSED
sync:
  include:
  - src/*.py
  exclude:
  - .env
  - .env.*
  - data/**
  - tests/**
  - .venv/**
  - src/**/__pycache__/**
  - src/**/*.pyc
targets:
  dev:
    default: true
    mode: development
    variables:
      schema: lichess_dev
      hf_repo: christopher3/lichess-games-dev
      schedule_status: UNPAUSED
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
