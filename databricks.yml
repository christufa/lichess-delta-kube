bundle:
  name: lichess-games-download
include:
- resources/*.yml
variables:
  catalog:
    description: Existing Unity Catalog catalog
    default: brikt
  schema:
    default: lichess
  volume:
    default: staging
  table:
    default: games
  hf_repo:
    default: christopher3/lichess-games
  hf_secret_scope:
    default: lichess
  hf_secret_key:
    default: hf-token
  schedule_status:
    description: Whether the monthly schedule is active
    default: PAUSED
sync:
  include:
  - src/lichess_pipeline/*.py
  exclude:
  - .env
  - .env.*
  - data/**
  - tests/**
  - .venv/**
  - src/**/__pycache__/**
  - src/**/*.pyc
  - dist/**
  - build/**
  - src/*.egg-info/**
targets:
  dev:
    default: true
    mode: development
    variables:
      schema: lichess_dev
      hf_repo: christopher3/lichess-games-dev
      schedule_status: UNPAUSED
    bundle:
      deployment:
        lock:
          enabled: true
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
workspace:
  artifact_path: /Volumes/${var.catalog}/${var.schema}/${var.volume}/artifacts/${bundle.name}/${bundle.target}/${workspace.current_user.short_name}
artifacts:
  pipeline:
    type: whl
    path: .
    build: python -m build --wheel
    dynamic_version: true
