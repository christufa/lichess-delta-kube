resources:
  jobs:
    lichess_pipeline:
      name: lichess-hf-delta-${bundle.target}
      max_concurrent_runs: 1
      parameters:
      - name: year
        default: '0'
      - name: month
        default: '0'
      - name: limit
        default: '0'
      - name: workers
        default: '4'
      tasks:
      - task_key: sync
        max_retries: 2
        min_retry_interval_millis: 60000
        environment_key: sync
        python_wheel_task:
          package_name: lichess_pipeline
          entry_point: sync
          parameters:
          - --catalog
          - ${var.catalog}
          - --schema
          - ${var.schema}
          - --volume
          - ${var.volume}
          - --run-id
          - '{{job.run_id}}'
          - --year
          - '{{job.parameters.year}}'
          - --month
          - '{{job.parameters.month}}'
          - --limit
          - '{{job.parameters.limit}}'
          - --workers
          - '{{job.parameters.workers}}'
          - --table
          - ${var.table}
      environments:
      - environment_key: sync
        spec:
          environment_version: '4'
          dependencies:
          - huggingface_hub[hf_xet]==0.36.0
          - tqdm>=4.66,<5
          - ../dist/*.whl
      schedule:
        quartz_cron_expression: 0 0 6 5 * ?
        timezone_id: America/New_York
        pause_status: ${var.schedule_status}
